<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Month at a Glance</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#efe8dc;color:#493628;font:14px Georgia,"Times New Roman",serif}.card{background:#efe8dc;border:1px solid #d8cbbb;border-radius:13px;padding:20px 22px 23px;width:100%;min-height:292px}.heading{font-size:12px;font-weight:400;letter-spacing:1.5px;padding-bottom:15px;border-bottom:1px solid #d8cbbb}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-top:15px;margin-bottom:13px;gap:8px}.month{font-size:18px;font-weight:400}.actions{display:flex;gap:4px}button{background:transparent;border:0;color:#705b49;cursor:pointer;border-radius:6px;padding:5px 8px;font-size:18px}button:hover,button:focus-visible{background:#e5dacb;outline:none}.days,.dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center;text-align:center}.days{color:#705b49;font-size:12px;margin-bottom:8px}.dates{row-gap:5px}.cell{height:30px;display:flex;align-items:center;justify-content:center}.date{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}.date.today{background:#b79a7d;color:#fff;font-weight:400}.date:not(.today){color:#493628}.date.out{color:#b4a695}.todaybutton{font-size:11px;padding:5px 7px;margin-right:1px}@media(max-width:340px){.card{padding:15px 12px}.date{font-size:12px;width:26px;height:26px}.cell{height:28px}}
</style></head><body><section class="card" aria-label="Monthly calendar"><div class="heading">MONTH AT A GLANCE</div><div class="monthbar"><div class="month" id="month"></div><div class="actions"><button class="todaybutton" id="goToday" title="Go to current month">Today</button><button id="prev" aria-label="Previous month">‹</button><button id="next" aria-label="Next month">›</button></div></div><div class="days" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="dates" id="dates"></div></section><script>
const now=new Date();let year=now.getFullYear(),month=now.getMonth();const m=document.getElementById('month'),grid=document.getElementById('dates');function render(){const today=new Date();m.textContent=new Date(year,month,1).toLocaleDateString('en-CA',{month:'long',year:'numeric'});grid.innerHTML='';const pad=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate();for(let i=0;i<pad;i++){const el=document.createElement('div');el.className='cell';grid.append(el)}for(let day=1;day<=days;day++){const box=document.createElement('div');box.className='cell';const d=document.createElement('span');d.className='date'+(year===today.getFullYear()&&month===today.getMonth()&&day===today.getDate()?' today':'');d.textContent=day;d.setAttribute('aria-label',new Date(year,month,day).toDateString());box.append(d);grid.append(box)}}document.getElementById('prev').onclick=()=>{const d=new Date(year,month-1,1);year=d.getFullYear();month=d.getMonth();render()};document.getElementById('next').onclick=()=>{const d=new Date(year,month+1,1);year=d.getFullYear();month=d.getMonth();render()};document.getElementById('goToday').onclick=()=>{const d=new Date();year=d.getFullYear();month=d.getMonth();render()};render();setInterval(()=>{if(year===new Date().getFullYear()&&month===new Date().getMonth())render()},60000)
</script></body></html>
